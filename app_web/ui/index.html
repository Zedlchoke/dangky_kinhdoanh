<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trợ lý hồ sơ ĐKKD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <button type="button" id="btn-toggle-side" class="icon-btn" aria-expanded="true"
      aria-controls="sidebar" title="Ẩn/hiện danh mục">☰</button>
    <h1 class="brand">Trợ lý hồ sơ ĐKKD</h1>
    <span id="doc-title" aria-live="polite"></span>
    <span id="save-status" data-state="unsaved" role="status">Chưa lưu</span>
  </header>

  <div id="layout">

    <!-- ============ THANH TRÁI: nhóm / case / mẫu ============ -->
    <aside id="sidebar" aria-label="Danh mục thủ tục">
      <label class="lbl" for="sel-nhom">Nhóm thủ tục</label>
      <select id="sel-nhom"></select>

      <label class="lbl" for="sel-case">Thủ tục</label>
      <select id="sel-case"></select>

      <div class="lbl">Mẫu biểu trong hồ sơ</div>
      <div id="form-list"></div>

      <label class="chkline"><input type="checkbox" id="chk-autosum">
        Tự cộng tổng vốn từ các bảng lặp</label>

      <button id="btn-export" class="btn btn-primary">Xuất hồ sơ (.docx)</button>

      <div class="sep"></div>
      <button id="btn-save-draft" class="btn">Lưu hồ sơ (.json)</button>
      <button id="btn-open-draft" class="btn">Mở hồ sơ (.json)</button>
      <!-- X5: phiếu Excel thu thập thông tin khách (PLAN.md mục 4.4).
           [E4 2026-09-10, owner chốt] ẨN nút "Xuất phiếu Excel cho khách"
           (v1 theo-form) — chỉ giữ NẠP v1 (thời gian chuyển đổi, PLAN §5-E4);
           luồng phát hành khách dùng workbook case-level bên dưới. -->
      <!-- <button id="btn-export-excel" class="btn">Xuất phiếu Excel cho khách</button> -->
      <button id="btn-import-excel" class="btn">Nạp phiếu Excel</button>
      <!-- E2: workbook Excel CASE-LEVEL — một file cho cả hồ sơ
           (PLAN_hoan_thien_pfat_hanh §2.1/§5-E2) -->
      <button id="btn-export-case-excel" class="btn">Xuất phiếu đầy đủ (nội bộ)</button>
      <button id="btn-export-case-excel-customer" class="btn">Xuất phiếu cho khách (rút gọn)</button>
      <button id="btn-import-case-excel" class="btn">Nạp Excel cả hồ sơ (case)</button>
      <div id="case-excel-info" class="lbl" hidden></div>
      <button id="btn-reset" class="btn btn-danger">Nhập lại</button>

      <div id="side-status"></div>
    </aside>

    <!-- ============ KHUNG GIỮA: tờ khai active duy nhất ============ -->
    <main id="scroller" aria-label="Nội dung mẫu biểu">
      <div id="pages"><!-- section.page-a4[data-doc-id] do app.js render --></div>
    </main>

    <!-- ============ PHẢI: hướng dẫn + lỗi kiểm tra (co/mở) ============ -->
    <section id="rightbar" aria-label="Hướng dẫn và lỗi">
      <button type="button" id="btn-toggle-right" class="icon-btn" aria-expanded="true"
        aria-controls="rightbar-body" title="Thu gọn panel">»</button>
      <div id="rightbar-body">
        <div class="lbl">Thông tin thủ tục</div>
        <div id="case-info"></div>

        <div class="sep"></div>
        <div class="panel-head">
          <div class="lbl">Kiểm tra lỗi</div>
          <label class="chkline"><input type="checkbox" id="chk-check-all">
            Toàn bộ hồ sơ</label>
        </div>
        <button id="btn-check" class="btn">Kiểm tra</button>
        <div id="err-panel">
          <div id="err-list" role="list" aria-label="Danh sách lỗi"></div>
        </div>

        <div class="sep"></div>
        <div id="auth-panel" class="auth-panel" aria-label="Hồ sơ ủy quyền dịch vụ">
          <div class="panel-head">
            <div class="lbl">Ủy quyền dịch vụ</div>
            <span id="auth-store-info" class="auth-muted"></span>
          </div>
          <label class="auth-field">
            <span>Người làm thủ tục</span>
            <select id="auth-agent-select"></select>
          </label>
          <div class="auth-btn-row">
            <button type="button" id="auth-btn-new-profile" class="btn btn-sm">Thêm</button>
            <button type="button" id="auth-btn-edit-profile" class="btn btn-sm">Sửa</button>
          </div>
          <div id="auth-profile-editor" class="auth-editor" hidden>
            <input type="hidden" id="auth-agent-id" name="agent_id">
            <label class="auth-field"><span>Họ tên *</span><input name="ho_ten" required></label>
            <label class="auth-field"><span>Số CCCD *</span><input name="so_cccd" required></label>
            <label class="auth-field"><span>Ngày sinh</span><input name="ngay_sinh" placeholder="dd/mm/yyyy"></label>
            <label class="auth-field"><span>Ngày cấp CCCD</span><input name="ngay_cap"></label>
            <label class="auth-field"><span>Nơi cấp</span><input name="noi_cap"></label>
            <label class="auth-field"><span>Địa chỉ liên hệ</span><input name="dia_chi_lien_he"></label>
            <label class="auth-field"><span>Điện thoại</span><input name="dien_thoai"></label>
            <label class="auth-field"><span>Email</span><input name="email"></label>
            <label class="auth-field"><span>Đơn vị dịch vụ</span><input name="don_vi_dich_vu"></label>
            <div class="auth-btn-row">
              <button type="button" id="auth-btn-save-profile" class="btn btn-sm btn-primary">Lưu profile</button>
              <button type="button" id="auth-btn-cancel-profile" class="btn btn-sm">Hủy</button>
            </div>
          </div>
          <div class="lbl" style="margin-top:8px">Mẫu theo thủ tục</div>
          <div id="auth-template-list"></div>
          <label class="auth-field"><span>Cơ quan tiếp nhận</span>
            <input id="auth-co-quan" placeholder="VD: Phòng ĐKKD – Sở Tài chính"></label>
          <label class="auth-field"><span>Thời hạn ủy quyền</span>
            <input id="auth-thoi-han" placeholder="VD: 30 ngày kể từ ngày ký"></label>
          <div class="auth-btn-row">
            <button type="button" id="auth-btn-generate" class="btn btn-primary">Sinh hồ sơ</button>
            <button type="button" id="auth-btn-open-dir" class="btn">Mở thư mục</button>
          </div>
          <div id="auth-last-result" class="auth-result"></div>
          <div class="auth-btn-row auth-backup-row">
            <button type="button" id="auth-btn-backup" class="btn btn-sm">Sao lưu profile</button>
            <button type="button" id="auth-btn-restore" class="btn btn-sm">Khôi phục</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- ============ THANH DƯỚI: tab mẫu + action chính ============ -->
  <footer id="tabbar">
    <div id="tabs" role="tablist" aria-label="Các mẫu biểu trong hồ sơ"></div>
    <div id="tab-actions">
      <button id="btn-save" class="btn" title="Lưu nháp nhanh (Ctrl+S)">Lưu</button>
      <button id="btn-export2" class="btn btn-primary">Xuất DOCX</button>
    </div>
  </footer>

  <!-- gợi ý VSIC + toast -->
  <div id="vsic-pop" hidden></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- ===== P2 R2 runtime wiring: nạp 3 platform module trước runtime =====
       Thứ tự dependency (không đổi được):
         fixed-matrix.js / nested-grid.js / output-table.js  (thuần, 0 DOM)
           -> form-domain.js (dispatcher theo section.kind + validation)
             -> render.js -> app.js
       Hai file đầu là CommonJS thuần (module.exports) nên cần shim nhỏ tạo
       rồi thu hồi global `window.module` quanh từng script; output-table.js
       là UMD và PHẢI thấy `window.module` không tồn tại để tự gắn
       window.OutputTable. KHÔNG sửa nội dung 3 module (chỉ require/gọi). -->
  <script>window.__P2_TABLES__ = {};</script>
  <script>window.module = { exports: {} };</script>
  <script src="fixed-matrix.js"></script>
  <script>
    (function () {
      var exp = window.module && window.module.exports;
      if (exp && !Array.isArray(exp)) {
        window.__P2_TABLES__.FixedMatrix = exp;   // API setCell/recompute/validate
      }
      delete window.module;
    })();
  </script>
  <script>window.module = { exports: {} };</script>
  <script src="nested-grid.js"></script>
  <script>
    (function () {
      var exp = window.module && window.module.exports;
      if (exp && !Array.isArray(exp)) {
        window.__P2_TABLES__.NestedGrid = exp;    // API headerLayout/validate
      }
      delete window.module;
    })();
  </script>
  <!-- UMD: nạp SAU cùng trong nhóm này, khi `window.module` đã được xóa -->
  <script src="output-table.js"></script>
  <script>
    /* namespace thống nhất FormDomain.p2TableModule / Render.p2TableModule đọc */
    window.P2Tables = window.__P2_TABLES__;
    if (window.OutputTable) { window.P2Tables.OutputTable = window.OutputTable; }
  </script>

  <script src="form-domain.js"></script>
  <script src="render.js"></script>
  <script src="authorization-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
